name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install vybir
        run: python -m pip install -e ".[ort,demo,server,dev]"
      - name: Lint
        run: ruff check vybir tests scripts
      - name: Test (tiny random models; real-checkpoint tests skip without the download)
        run: pytest -q
