[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vybir"
version = "0.1.0"
description = "Local AI that decides and knows when it does not know: Laya typed decisions on any PC, with a statistical error guarantee. Plus a learner that teaches itself Tetris, Snake and 2048."
keywords = ["laya", "typed-decisions", "decision-model", "local-ai", "conformal-prediction", "uncertainty", "onnx", "pytorch", "windows", "cuda", "reinforcement-learning", "tetris", "snake", "2048"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "huggingface-hub>=0.34,<2",
  "tokenizers>=0.21,<1",
  "safetensors>=0.6",
]

[project.optional-dependencies]
ort = ["onnxruntime>=1.20", "onnx>=1.17", "onnxscript>=0.4"]
int8 = ["torchao>=0.10"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
demo = ["rich>=13", "Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.12", "transformers>=5"]
research = ["scikit-learn>=1.3", "pandas>=2", "pyarrow>=15", "matplotlib>=3.8"]

[project.scripts]
vybir = "vybir.cli:main"

[project.urls]
Repository = "https://github.com/Galactic717/vybir"
Issues = "https://github.com/Galactic717/vybir/issues"
Laya = "https://github.com/NandhaKishorM/laya"

[tool.hatch.build.targets.wheel]
packages = ["vybir"]

[tool.hatch.build.targets.sdist]
include = ["/vybir", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the cached convaiinnovations/laya checkpoint"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
